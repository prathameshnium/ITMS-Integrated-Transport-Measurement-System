name: Documentation Correction
description: Report errors or unclear explanations in the ITMS documentation.
title: "[DOC]: "
labels: ["documentation", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the ITMS documentation!
  - type: textarea
    id: description
    attributes:
      label: Description of the Error
      description: Which page or section contains the error?
      placeholder: e.g. The temperature range on the PPMS Interface page does not match the README.
    validations:
      required: true
